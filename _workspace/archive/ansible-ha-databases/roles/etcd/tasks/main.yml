---
- name: Install etcd from the distribution repository
  ansible.builtin.apt:
    name: etcd-server
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Render etcd configuration
  ansible.builtin.template:
    src: etcd.conf.j2
    dest: /etc/default/etcd
    mode: "0644"
    owner: root
    group: root
  notify: Restart etcd

- name: Enable and start etcd
  ansible.builtin.service:
    name: etcd
    state: started
    enabled: true

# Generated by pipeline-platform 1.0.0 from .platform.yml. Do not edit.
stages:
- test
- build
- scan
- deploy
variables:
  IMAGE_REPOSITORY: nexus.example.com:8082/shop/orders-api
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  IMAGE: $IMAGE_REPOSITORY:$IMAGE_TAG
  REGISTRY_HOST: nexus.example.com:8082
  VAULT_SERVER_URL: https://vault.example.com
  VAULT_AUTH_ROLE: ci-orders-api
  VAULT_AUTH_PATH: jwt
test:
  stage: test
  image: python:3.12-slim
  script:
  - pip install -r requirements.txt
  - pytest --junitxml=report.xml
  interruptible: true
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 1 week
gitleaks:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint:
    - ''
  script:
  - gitleaks detect --source . --redact --verbose
  interruptible: true
build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint:
    - ''
  script:
  - mkdir -p /kaniko/.docker
  - |-
    AUTH=$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')
    printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY_HOST" "$AUTH" > /kaniko/.docker/config.json
  - /kaniko/executor --context . --dockerfile Dockerfile --destination "$IMAGE" --destination "$IMAGE_REPOSITORY:$CI_COMMIT_TAG"
    --cache=true
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.example.com
  secrets:
    REGISTRY_USER:
      vault:
        engine:
          name: kv-v2
          path: ci
        path: nexus/docker
        field: username
      token: $VAULT_ID_TOKEN
    REGISTRY_PASSWORD:
      vault:
        engine:
          name: kv-v2
          path: ci
        path: nexus/docker
        field: password
      token: $VAULT_ID_TOKEN
trivy:
  stage: scan
  image:
    name: aquasec/trivy:0.56.2
    entrypoint:
    - ''
  needs:
  - build
  script:
  - export TRIVY_USERNAME="$REGISTRY_USER" TRIVY_PASSWORD="$REGISTRY_PASSWORD"
  - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE"
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.example.com
  secrets:
    REGISTRY_USER:
      vault:
        engine:
          name: kv-v2
          path: ci
        path: nexus/docker
        field: username
      token: $VAULT_ID_TOKEN
    REGISTRY_PASSWORD:
      vault:
        engine:
          name: kv-v2
          path: ci
        path: nexus/docker
        field: password
      token: $VAULT_ID_TOKEN
deploy:prod:
  image: registry.example.com/platform/pipeline-platform:v1
  script:
  - |-
    git config --global user.name pipeline-platform
    git config --global user.email pipeline-platform@users.noreply.invalid
  - git clone --depth 1 --branch main "https://oauth2:${GITOPS_TOKEN}@"$(printf '%s' https://git.example.com/platform/gitops.git
    | sed 's#^https://##') gitops
  - cd gitops
  - pipeline-platform bump-tag --file apps/orders-api/prod/values.yaml --tag "$IMAGE_TAG"
  - |-
    git add -A
    if git diff --cached --quiet; then echo 'values already at this tag'; exit 0; fi
    git commit -m "deploy orders-api prod: $IMAGE_TAG"
    for i in 1 2 3; do git push origin HEAD:main && break; git pull --rebase origin main; done
  - export ARGOCD_SERVER=argocd.example.com
  - argocd app wait orders-api-prod --health --sync --timeout 300 --grpc-web
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.example.com
  secrets:
    GITOPS_TOKEN:
      vault:
        engine:
          name: kv-v2
          path: ci
        path: gitops
        field: token
      token: $VAULT_ID_TOKEN
    ARGOCD_AUTH_TOKEN:
      vault:
        engine:
          name: kv-v2
          path: ci
        path: argocd
        field: token
      token: $VAULT_ID_TOKEN
  stage: deploy
  needs:
  - build
  - trivy
  environment:
    name: prod
  resource_group: orders-api-prod
  when: manual
  allow_failure: false

# Generated by pipeline-platform 1.0.0 from .platform.yml. Do not edit.
stages:
- test
- build
- deploy
variables:
  IMAGE_REPOSITORY: nexus.example.com:8082/infra/legacy-gateway
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  IMAGE: $IMAGE_REPOSITORY:$IMAGE_TAG
  REGISTRY_HOST: nexus.example.com:8082
  VAULT_SERVER_URL: https://vault.example.com
  VAULT_AUTH_ROLE: ci-legacy-gateway
  VAULT_AUTH_PATH: jwt
gitleaks:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint:
    - ''
  script:
  - gitleaks detect --source . --redact --verbose
  interruptible: true
build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint:
    - ''
  script:
  - mkdir -p /kaniko/.docker
  - |-
    AUTH=$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')
    printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY_HOST" "$AUTH" > /kaniko/.docker/config.json
  - /kaniko/executor --context . --dockerfile Dockerfile --destination "$IMAGE" --destination "$IMAGE_REPOSITORY:$CI_COMMIT_TAG"
    --cache=true
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.example.com
  secrets:
    REGISTRY_USER:
      vault:
        engine:
          name: kv-v2
          path: ci
        path: nexus/docker
        field: username
      token: $VAULT_ID_TOKEN
    REGISTRY_PASSWORD:
      vault:
        engine:
          name: kv-v2
          path: ci
        path: nexus/docker
        field: password
      token: $VAULT_ID_TOKEN
deploy:prod:
  image: willhallonline/ansible:2.16-alpine-3.19
  variables:
    ANSIBLE_HOST_KEY_CHECKING: 'false'
    DEPLOY_ENV: prod
  script:
  - chmod 600 "$SSH_PRIVATE_KEY"
  - ansible-playbook -i deploy/inventories/prod deploy/site.yml --private-key "$SSH_PRIVATE_KEY" -e "image=$IMAGE" -e "image_tag=$IMAGE_TAG"
    -e service_name=legacy-gateway
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.example.com
  secrets:
    DB_PASSWORD:
      vault:
        engine:
          name: kv-v2
          path: apps
        path: legacy-gateway/prod
        field: db_password
      token: $VAULT_ID_TOKEN
    SSH_PRIVATE_KEY:
      vault:
        engine:
          name: kv-v2
          path: ci
        path: ssh/deploy
        field: private_key
      token: $VAULT_ID_TOKEN
      file: true
  stage: deploy
  needs:
  - build
  environment:
    name: prod
  resource_group: legacy-gateway-prod
  when: manual
  allow_failure: false

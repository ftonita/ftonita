# Generated by pipeline-platform 1.0.0 from .platform.yml. Do not edit.
stages:
- test
- build
- scan
- deploy
variables:
  IMAGE_REPOSITORY: artifactory.example.com/docker-local/finance/billing-worker
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  IMAGE: $IMAGE_REPOSITORY:$IMAGE_TAG
  REGISTRY_HOST: artifactory.example.com
  VAULT_SERVER_URL: https://vault.example.com
  VAULT_AUTH_ROLE: ci-billing-worker
  VAULT_AUTH_PATH: jwt
gitleaks:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint:
    - ''
  script:
  - gitleaks detect --source . --redact --verbose
  interruptible: true
build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint:
    - ''
  script:
  - mkdir -p /kaniko/.docker
  - |-
    AUTH=$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')
    printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY_HOST" "$AUTH" > /kaniko/.docker/config.json
  - /kaniko/executor --context . --dockerfile Dockerfile --destination "$IMAGE" --cache=true --build-arg APP_ENV=production
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.example.com
  secrets:
    REGISTRY_USER:
      vault:
        engine:
          name: kv-v2
          path: ci
        path: artifactory
        field: user
      token: $VAULT_ID_TOKEN
    REGISTRY_PASSWORD:
      vault:
        engine:
          name: kv-v2
          path: ci
        path: artifactory
        field: token
      token: $VAULT_ID_TOKEN
trivy:
  stage: scan
  image:
    name: aquasec/trivy:0.56.2
    entrypoint:
    - ''
  needs:
  - build
  script:
  - export TRIVY_USERNAME="$REGISTRY_USER" TRIVY_PASSWORD="$REGISTRY_PASSWORD"
  - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE"
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.example.com
  secrets:
    REGISTRY_USER:
      vault:
        engine:
          name: kv-v2
          path: ci
        path: artifactory
        field: user
      token: $VAULT_ID_TOKEN
    REGISTRY_PASSWORD:
      vault:
        engine:
          name: kv-v2
          path: ci
        path: artifactory
        field: token
      token: $VAULT_ID_TOKEN
deploy:stage:
  image:
    name: alpine/k8s:1.30.4
    entrypoint:
    - ''
  script:
  - helm upgrade --install billing-worker-stage ./deploy/chart --namespace billing-stage --create-namespace --atomic --timeout
    5m --set "image.repository=$IMAGE_REPOSITORY" --set "image.tag=$IMAGE_TAG" -f deploy/values-stage.yaml --set replicaCount=2
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.example.com
  secrets:
    KUBECONFIG:
      vault:
        engine:
          name: kv-v2
          path: ci
        path: k8s/stage
        field: kubeconfig
      token: $VAULT_ID_TOKEN
      file: true
  stage: deploy
  needs:
  - build
  - trivy
  environment:
    name: stage
  resource_group: billing-worker-stage

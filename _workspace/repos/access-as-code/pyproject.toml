[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "access-as-code"
dynamic = ["version"]
description = "Declare who may do what in one reviewed YAML file; lint least-privilege rules, compile to Vault policies, Kubernetes RBAC and GitLab members, and detect drift."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
access-as-code = "access_as_code.cli:main"

[tool.setuptools.dynamic]
version = { attr = "access_as_code.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
